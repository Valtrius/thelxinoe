name: Publish reviewed release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed draft tag (X.Y.Z)
        required: true
        type: string
  # The final, reviewer-approved job of Assemble release draft.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

# Holds write tokens: third-party actions are pinned to commits.
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release-publish
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: ./.github/actions/setup-rust
      # Compiled before the write token is in the environment.
      - name: Build the release verifier
        run: cargo build --locked -p thelxinoe-releases --bin verify-release
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and promote existing artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run from the tag itself: gh workflow run publish-release.yml --ref X.Y.Z -f tag=X.Y.Z
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          node scripts/release.mjs check "$RELEASE_TAG"
          gh release download "$RELEASE_TAG" --dir release-assets
          node scripts/release.mjs publish "$RELEASE_TAG" release-assets
