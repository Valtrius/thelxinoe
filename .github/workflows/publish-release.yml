name: Publish reviewed release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed draft tag (X.Y.Z)
        required: true
        type: string
  # The final, reviewer-approved job of Assemble release draft.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

# Holds write tokens: third-party actions are pinned to commits.
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release-publish
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/setup-rust
      # Compiled before the write token is in the environment.
      - name: Build the release verifier
        run: cargo build --locked -p thelxinoe-releases --bin verify-release
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and promote existing artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run from the tag itself: gh workflow run publish-release.yml --ref X.Y.Z -f tag=X.Y.Z
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          node scripts/release.mjs check "$RELEASE_TAG"
          gh release download "$RELEASE_TAG" --dir release-assets
          node scripts/release.mjs publish "$RELEASE_TAG" release-assets
