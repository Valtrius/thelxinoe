name: Check live Recyclarr guides
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Installations fetch the current guides from GitHub. Other CI runs use the commits
# pinned in scripts/recyclarr-guide-mirror.mjs, so only this run sees upstream changes.
jobs:
  recyclarr:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      THELXINOE_RECYCLARR_LIVE_GUIDES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/ci.mjs recyclarr
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: recyclarr-test-evidence
          include-hidden-files: true
          path: |
            .local/ci-browser*.log
            .local/*-result.json
            .local/thelxinoe-*/result.json
            .local/thelxinoe-*/services.log
            .local/thelxinoe-*/trace.zip
            .local/thelxinoe-*/*.png
