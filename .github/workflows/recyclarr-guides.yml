name: Check live Recyclarr guides
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Installations fetch the current guides from GitHub. Other CI runs use the commits
# pinned in scripts/recyclarr-guide-mirror.mjs, so only this run sees upstream changes.
jobs:
  recyclarr:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      THELXINOE_RECYCLARR_LIVE_GUIDES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/ci.mjs recyclarr
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: recyclarr-test-evidence
          include-hidden-files: true
          path: |
            .local/ci-browser*.log
            .local/*-result.json
            .local/thelxinoe-*/result.json
            .local/thelxinoe-*/services.log
            .local/thelxinoe-*/trace.zip
            .local/thelxinoe-*/*.png
