name: Assemble release draft
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "${RELEASE_REF#refs/tags/}" != "$RELEASE_REF"
          node scripts/release.mjs check "$RELEASE_TAG"
          echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  verify:
    needs: version
    uses: ./.github/workflows/ci.yml
  desktop:
    needs: verify
    runs-on: windows-latest
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: node scripts/release.mjs desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: signed-desktop
          path: release-desktop/
          if-no-files-found: error
  images:
    needs: [version, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      server: ${{ steps.server.outputs.digest }}
      controller: ${{ steps.controller.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: server
        with:
          context: .
          target: server
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/valtrius/thelxinoe-server:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
      - uses: docker/build-push-action@v6
        id: controller
        with:
          context: .
          target: controller
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/valtrius/thelxinoe-controller:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=release
  draft:
    needs: [desktop, images]
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: signed-desktop
          path: release-desktop
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble and verify final assets
        env:
          MANIFEST_SIGNING_PRIVATE_KEY: ${{ secrets.MANIFEST_SIGNING_PRIVATE_KEY }}
          SERVER_DIGEST: ${{ needs.images.outputs.server }}
          CONTROLLER_DIGEST: ${{ needs.images.outputs.controller }}
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync, readdirSync, unlinkSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const key = process.env.RUNNER_TEMP + '/manifest-signing.pem';
          if (!process.env.MANIFEST_SIGNING_PRIVATE_KEY) throw Error('Missing manifest signing key');
          writeFileSync(key, process.env.MANIFEST_SIGNING_PRIVATE_KEY, {mode:0o600});
          try {
            const file = 'release-desktop/' + readdirSync('release-desktop').find(n => n.endsWith('.exe'));
            execFileSync(process.execPath, ['scripts/release.mjs','assemble','release-assets',file,file+'.sig','release-desktop/updater.pub',key,'ghcr.io/valtrius/thelxinoe-server@'+process.env.SERVER_DIGEST,'ghcr.io/valtrius/thelxinoe-controller@'+process.env.CONTROLLER_DIGEST], {stdio:'inherit'});
          } finally {unlinkSync(key);}
          NODE
      - run: node scripts/release.mjs draft release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
