name: Build and verify
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Release tags need a finished run of their develop commit, so other runs group by
# commit: one group per ref would keep a single pending run and cancel the rest.
# Only superseded pull request runs are cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  THELXINOE_CI_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
  THELXINOE_CI_RESOURCE_DIRECTORY: ${{ github.workspace }}/.local/ci-resources
  # Built once by the images job and loaded by every container job.
  THELXINOE_SERVER_IMAGE: thelxinoe-ci-server:gha-${{ github.run_id }}
  THELXINOE_CONTROLLER_IMAGE: thelxinoe-ci-controller:gha-${{ github.run_id }}

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/setup-rust
      # The FFmpeg build the server image ships; a miss downloads it again.
      - uses: actions/cache@v4
        with:
          path: .local/ci-tools
          key: ffmpeg-${{ hashFiles('scripts/server-tools.lock.json') }}
      - name: Ensure FFmpeg is available
        timeout-minutes: 8
        run: bash scripts/ci-install-media.sh
      # Package operations run the Python the server image provides there.
      - run: sudo ln -sf "$(command -v python3)" /usr/local/bin/python3
      - run: pnpm run ci:server
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .local/ci-tools
          key: ffmpeg-${{ hashFiles('scripts/server-tools.lock.json') }}
      - name: Ensure FFmpeg is available
        timeout-minutes: 8
        run: bash scripts/ci-install-media.sh
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run ci:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-test-evidence
          path: |
            playwright-report/
            test-results/
  mock:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .local/ci-tools
          key: ffmpeg-${{ hashFiles('scripts/server-tools.lock.json') }}
      - name: Ensure FFmpeg is available
        timeout-minutes: 8
        run: bash scripts/ci-install-media.sh
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run ci:mock
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mock-test-evidence
          path: |
            playwright-report/
            test-results/
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Fixture images are pinned by digest, so signing in changes only whose
      # GHCR quota a pull spends: this job's token instead of the runner's
      # shared address.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm run ci:images
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: .local/ci-images.tar.gz
          compression-level: 0
          retention-days: 1
          overwrite: true
  containers:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        phase: [services, recyclarr, media, transfers]
    name: containers (${{ matrix.phase }})
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: images
          path: .local
      - run: docker load --input .local/ci-images.tar.gz && rm .local/ci-images.tar.gz
      - uses: actions/cache@v4
        with:
          path: .local/ci-tools
          key: ffmpeg-${{ hashFiles('scripts/server-tools.lock.json') }}
      - name: Ensure FFmpeg is available
        timeout-minutes: 8
        run: bash scripts/ci-install-media.sh
      - run: node scripts/ci.mjs ${{ matrix.phase }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.phase }}-test-evidence
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
            .local/ci-browser*.log
            .local/*-result.json
            .local/*.png
            .local/thelxinoe-*/result.json
            .local/thelxinoe-*/services.log
            .local/thelxinoe-*/trace.zip
            .local/thelxinoe-*/*.png
            .local/transfer-qualification.json
  desktop:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/setup-rust
      - run: pnpm install --frozen-lockfile
      # Pinned MPV and FFmpeg for the native playback tests; a miss downloads them again.
      - uses: actions/cache@v4
        with:
          path: .local/ci-tools
          key: native-tools-${{ hashFiles('scripts/ci-native-tools.json') }}
      - run: pnpm run ci:desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-evidence
          path: test-results/
  updates-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        phase: [updates-server, updates-published]
    name: ${{ matrix.phase }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.phase == 'updates-server'
        run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/ci.mjs ${{ matrix.phase }}
        env:
          # A published version whose controller cannot update, while its fix ships.
          THELXINOE_SKIP_PUBLISHED_UPDATE: ${{ vars.THELXINOE_SKIP_PUBLISHED_UPDATE }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.phase }}-evidence
          include-hidden-files: true
          path: |
            .local/ci-browser*.log
            test-results/updates/
  updates-desktop:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/setup-rust
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm run ci:updates:desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-update-evidence
          include-hidden-files: true
          path: |
            .local/ci-browser*.log
            test-results/updates/
