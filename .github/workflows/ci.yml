name: Build and verify
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  THELXINOE_CI_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
  THELXINOE_CI_RESOURCE_DIRECTORY: ${{ github.workspace }}/.local/ci-resources

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm run ci:server
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-evidence
          path: |
            .local/ci-*.json
            .local/ci-command.log
            .local/server-verification/
          include-hidden-files: true
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ensure FFmpeg is available
        timeout-minutes: 8
        run: bash scripts/ci-install-media.sh
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run ci:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-evidence
          path: |
            .local/ci-*.json
            .local/ci-command.log
            .local/ci-browser*.log
            playwright-report/
            test-results/
          include-hidden-files: true
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ensure FFmpeg is available
        timeout-minutes: 8
        run: bash scripts/ci-install-media.sh
      - run: pnpm run ci:containers
      - name: Clean owned test resources
        if: always()
        run: node scripts/ci-clean-resources.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-test-evidence
          path: |
            .local/ci-*.json
            .local/ci-command.log
            .local/ci-browser*.log
            playwright-report/
            test-results/
            .local/*-result.json
            .local/thelxinoe-connections-*/result.json
            .local/thelxinoe-connections-*/services.log
            .local/thelxinoe-access-*/services.log
            .local/thelxinoe-recyclarr-*/result.json
            .local/thelxinoe-recyclarr-*/trace.zip
            .local/thelxinoe-recyclarr-*/services.log
            .local/thelxinoe-recyclarr-*/*.png
            .local/*.png
            .local/selected-audio.ts
            .local/ci-resources/
          include-hidden-files: true
  desktop:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/setup-rust
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-test-evidence
          path: |
            .local/ci-*.json
            .local/ci-command.log
            test-results/
          include-hidden-files: true
  updates-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci:updates:server
      - name: Clean owned test resources
        if: always()
        run: node scripts/ci-clean-resources.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-update-evidence
          path: |
            .local/ci-*.json
            .local/ci-command.log
            .local/ci-browser*.log
            test-results/updates/
            .local/ci-resources/
          include-hidden-files: true
  updates-desktop:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/setup-rust
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm run ci:updates:desktop
      - name: Clean owned test resources
        if: always()
        run: node scripts/ci-clean-resources.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-update-evidence
          path: |
            .local/ci-*.json
            .local/ci-command.log
            .local/ci-browser*.log
            test-results/updates/
            .local/ci-resources/
          include-hidden-files: true
