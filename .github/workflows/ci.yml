name: Build and verify
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: python3 -B -m unittest discover -s tests -p '*_test.py'
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: npm run test:player
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node scripts/fixtures.mjs
      - run: npx playwright install --with-deps chromium
      - run: docker compose build
      - run: docker compose config --quiet
      - run: docker compose -f compose.test.yaml up -d --wait
      - run: npm run test:e2e
        env:
          THELXINOE_PROXY_TEST: 1
          THELXINOE_TEST_URL: https://localhost:9443
      - if: always()
        run: docker compose -f compose.test.yaml down
      - run: node scripts/playback-fixtures.mjs
      - run: docker compose -p thelxinoe-playback -f compose.test.yaml up -d --wait
        env:
          THELXINOE_TEST_HTTP_PORT: 18686
          THELXINOE_TEST_HTTPS_PORT: 20443
          THELXINOE_TEST_SUBNET: 172.31.252.0/24
      - run: node scripts/test-playback.mjs && node scripts/test-playback-tracks.mjs
      - run: node scripts/test-user-media.mjs
      - if: always()
        run: docker compose -p thelxinoe-playback -f compose.test.yaml down
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run desktop:build
      - run: cargo clippy --workspace --all-targets -- -D warnings
