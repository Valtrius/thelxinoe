name: Build and verify
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run ci:server
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: npm run ci:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-evidence
          path: |
            playwright-report/
            test-results/
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      - name: Start isolated container-test browser
        timeout-minutes: 10
        run: |
          version=$(node -p 'require("@playwright/test/package.json").version')
          image="mcr.microsoft.com/playwright:v${version}-noble"
          for attempt in 1 2 3 4; do
            if timeout 120s docker pull "$image"; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep "$((attempt * 3))"
          done
          docker run --detach --pull never --name thelxinoe-ci-browser \
            --init --ipc=host --user pwuser --workdir /opt/playwright \
            --mount "type=bind,source=$GITHUB_WORKSPACE/node_modules,target=/opt/playwright/node_modules,readonly" \
            --publish 127.0.0.1:3000:3000 \
            "$image" node node_modules/playwright/cli.js run-server --port 3000 --host 0.0.0.0
          for attempt in $(seq 1 30); do
            if [[ "$(docker logs thelxinoe-ci-browser 2>&1)" == *"Listening on ws://"* ]]; then exit 0; fi
            sleep 1
          done
          docker logs thelxinoe-ci-browser
          exit 1
      - run: npm run ci:containers
        env:
          THELXINOE_CI_BROWSER_WS_ENDPOINT: ws://127.0.0.1:3000/
      - name: Stop isolated container-test browser
        if: always()
        run: |
          mkdir -p .local
          if docker inspect thelxinoe-ci-browser > /dev/null 2>&1; then
            docker logs thelxinoe-ci-browser > .local/ci-browser.log 2>&1
            docker rm --force thelxinoe-ci-browser
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-test-evidence
          path: |
            playwright-report/
            test-results/
            .local/*-result.json
            .local/thelxinoe-connections-*/result.json
            .local/thelxinoe-recyclarr-*/result.json
            .local/thelxinoe-recyclarr-*/trace.zip
            .local/thelxinoe-recyclarr-*/services.log
            .local/thelxinoe-recyclarr-*/*.png
            .local/*.png
            .local/selected-audio.ts
            .local/ci-browser.log
          include-hidden-files: true
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run ci:desktop
  updates-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run ci:updates:server
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-update-evidence
          path: test-results/updates/
  updates-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run ci:updates:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-update-evidence
          path: test-results/updates/
