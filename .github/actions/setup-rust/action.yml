# Release jobs holding signing secrets use this too: actions are pinned to commits.
name: Set up pinned Rust
description: Install the repository toolchain and restore its build cache
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: node --input-type=module -e "import fs from 'node:fs'; const version=fs.readFileSync('rust-toolchain.toml','utf8').match(/channel = \"([^\"]+)\"/)[1]; fs.appendFileSync(process.env.GITHUB_OUTPUT,'toolchain='+version+'\n');"
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: ${{ steps.version.outputs.toolchain }}
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
