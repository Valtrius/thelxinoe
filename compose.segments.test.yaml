name: thelxinoe-segments
services:
  controller:
    image: thelxinoe-controller:0.1.0
    network_mode: none
    volumes:
      - runtime:/run/thelxinoe
      - deployment:/var/lib/thelxinoe/deployment
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    cap_drop: [ALL]
  server:
    image: thelxinoe-server:0.1.0
    ports: ["127.0.0.1:19292:8484"]
    environment:
      THELXINOE_PUBLIC_URL: https://localhost:26443
      THELXINOE_TRUSTED_PROXIES: 172.31.244.0/24
    volumes:
      - ./.local/segments/server:/var/lib/thelxinoe
      - ./.local/segments/cache:/var/cache/thelxinoe
      - ./.local/segments/data:/data:ro
      - runtime:/run/thelxinoe:ro
    networks: [test]
    depends_on:
      controller: {condition: service_healthy}
  proxy:
    image: caddy:2
    ports: ["127.0.0.1:26443:9443"]
    volumes: ["./tests/Caddyfile:/etc/caddy/Caddyfile:ro"]
    networks: [test]
    depends_on:
      server: {condition: service_healthy}
networks:
  test:
    ipam:
      config: [{subnet: 172.31.244.0/24}]
volumes:
  runtime:
  deployment:
