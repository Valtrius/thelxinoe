[package]
name = "thelxinoe-server"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
rusqlite.workspace = true
thelxinoe-core.workspace = true
thelxinoe-database.workspace = true
thelxinoe-auth.workspace = true
thelxinoe-jobs.workspace = true
thelxinoe-catalog.workspace = true
thelxinoe-playback.workspace = true
thelxinoe-releases = { path = "../../crates/releases" }
notify = "8"
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
tower-http = { version = "0.6", features = ["fs", "cors", "set-header", "limit"] }
ipnet = "2"
chrono-tz = "0.10"
chrono.workspace = true
futures-util = "0.3"
url = "2"
fs2 = "0.4"
tower = { version = "0.5", features = ["util"] }
oauth2 = { version = "5", default-features = false }
sha2 = "0.11"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
process-wrap = { version = "10", default-features = false, features = ["tokio1", "creation-flags", "job-object", "kill-on-drop", "process-group"] }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }
