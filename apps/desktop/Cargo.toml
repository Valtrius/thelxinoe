[package]
name = "thelxinoe-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
url = "2"
keyring = "4.1"
anyhow.workspace = true
uuid.workspace = true
sha2 = "0.11"
sevenz-rust2 = { version = "0.22.2", default-features = false }
futures-util = "0.3"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "=2.11.0"
tauri-plugin-window-state = "2.4.1"
thelxinoe-core.workspace = true
thelxinoe-releases = { path = "../../crates/releases" }
semver = "1"

chrono.workspace = true
rusqlite.workspace = true
tracing.workspace = true
thiserror = "2"
fs2 = "0.4.3"
regex = "1.13.1"
open = "5.4.0"
which = "8"
futures = "0.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
thelxinoe-auth.workspace = true
thelxinoe-database.workspace = true
anyhow.workspace = true
