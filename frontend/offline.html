<!doctype html>
<html lang="en" class="scheme-light dark:scheme-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#05070b" />
    <title>Thelxinoe — connection unavailable</title>
    <!-- offline-styles -->
  </head>
  <body
    class="m-0 grid min-h-dvh place-items-center bg-[#edf1f3] font-['Segoe_UI',system-ui,sans-serif] text-sm text-[#11171b] dark:bg-[#05070b] dark:text-[#eef7fb]"
  >
    <main class="box-content max-w-lg p-8">
      <h1 class="my-4 text-2xl font-bold tracking-[-0.035em]">
        Connect to your server
      </h1>
      <p class="my-3.5 leading-[1.6] text-[#5d6870] dark:text-[#93a1aa]">
        Thelxinoe cannot reach your server. Check your connection and that the
        server is running, then try again.
      </p>
      <a
        class="inline-block border border-[#087e9f40] bg-[#087e9f]/8 px-[1.4rem] py-[0.8rem] text-[11px] font-semibold tracking-[0.08em] text-[#087e9f] uppercase no-underline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-current dark:border-[#bcecff40] dark:bg-[#bcecff]/8 dark:text-[#bcecff]"
        href="/"
        >Reconnect</a
      >
    </main>
  </body>
</html>
