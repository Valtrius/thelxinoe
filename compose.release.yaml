name: thelxinoe
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  controller:
    container_name: thelxinoe-controller
    image: ${THELXINOE_CONTROLLER_IMAGE:-ghcr.io/valtrius/thelxinoe-controller:latest}
    # Images are published for Linux amd64 only.
    platform: linux/amd64
    restart: unless-stopped
    user: "0:${THELXINOE_GID:-10001}"
    network_mode: none
    environment:
      THELXINOE_BACKUPS: /backups
    volumes:
      - controller-runtime:/run/thelxinoe
      - /var/run/docker.sock:/var/run/docker.sock
      - deployment:/var/lib/thelxinoe/deployment
      - ${THELXINOE_BACKUP_ROOT:-./.local/backups}:/backups
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    logging: *logging
    labels:
      app.thelxinoe.component: controller
  server:
    container_name: thelxinoe-server
    image: ${THELXINOE_SERVER_IMAGE:-ghcr.io/valtrius/thelxinoe-server:latest}
    platform: linux/amd64
    restart: unless-stopped
    user: "${THELXINOE_UID:-10001}:${THELXINOE_GID:-10001}"
    depends_on:
      controller:
        condition: service_healthy
    ports:
      - ${THELXINOE_LISTEN:-127.0.0.1}:8484:8484
      - ${THELXINOE_LISTEN:-127.0.0.1}:7359:7359/udp
    environment:
      THELXINOE_PUBLIC_URL: ${THELXINOE_PUBLIC_URL:-}
      THELXINOE_TRUSTED_PROXIES: ${THELXINOE_TRUSTED_PROXIES:-}
      THELXINOE_DISCOVERY: ${THELXINOE_DISCOVERY:-true}
      THELXINOE_DISCOVERY_URL: ${THELXINOE_DISCOVERY_URL:-}
      THELXINOE_CORS_ORIGINS: ${THELXINOE_CORS_ORIGINS:-}
    volumes:
      - ${THELXINOE_STATE_ROOT:-./.local/docker}/server:/var/lib/thelxinoe
      - ${THELXINOE_STATE_ROOT:-./.local/docker}/cache:/var/cache/thelxinoe
      - ${THELXINOE_MEDIA_ROOT:-./.local/media}:/media
      - ${THELXINOE_BACKUP_ROOT:-./.local/backups}:/backups
      - controller-runtime:/run/thelxinoe:ro
    read_only: true
    tmpfs:
      - /tmp:size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging: *logging
    labels:
      app.thelxinoe.component: server
networks:
  default:
    # YouTube may block one address family; IPv6 lets public videos switch.
    # Needs Docker Engine 27 or Docker Desktop 4.42 and host IPv6 access.
    enable_ipv6: ${THELXINOE_IPV6:-false}
volumes:
  controller-runtime:
  deployment:
