name: thelxinoe-test
services:
  controller:
    image: ${THELXINOE_CONTROLLER_IMAGE:-thelxinoe-controller:0.1.0}
    network_mode: none
    volumes:
      - runtime:/run/thelxinoe
      - controller-state:/var/lib/thelxinoe/deployment
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
  server:
    image: ${THELXINOE_SERVER_IMAGE:-thelxinoe-server:0.1.0}
    ports:
      - "127.0.0.1:${THELXINOE_TEST_HTTP_PORT:-18484}:8484"
      - "127.0.0.1:${THELXINOE_TEST_HTTP_PORT:-18484}:7359/udp"
      - "127.0.0.1:${THELXINOE_TEST_OIDC_PORT:-18989}:${THELXINOE_TEST_OIDC_PORT:-18989}"
    environment:
      THELXINOE_TOOLS_CATALOG: /opt/thelxinoe/tools/catalog.json
      THELXINOE_PUBLIC_URL: https://localhost:${THELXINOE_TEST_HTTPS_PORT:-9443}
      THELXINOE_TRUSTED_PROXIES: ${THELXINOE_TEST_SUBNET:-172.31.250.0/24}
      RUST_LOG: ${THELXINOE_TEST_LOG:-thelxinoe=info}
      THELXINOE_DISCOVERY_URL: http://127.0.0.1:${THELXINOE_TEST_HTTP_PORT:-18484}
    depends_on:
      controller:
        condition: service_healthy
    volumes:
      - state:/var/lib/thelxinoe
      - cache:/var/cache/thelxinoe
      - fixtures:/media
      - runtime:/run/thelxinoe:ro
    networks: [proxy]
  auth-provider:
    image: node:24-alpine
    network_mode: service:server
    command: [node, /fixture/auth-idp.mjs]
    environment:
      THELXINOE_TEST_OIDC_PORT: ${THELXINOE_TEST_OIDC_PORT:-18989}
    volumes:
      - ./scripts/auth-idp.mjs:/fixture/auth-idp.mjs:ro
    read_only: true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:'+process.env.THELXINOE_TEST_OIDC_PORT+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 1s
      timeout: 3s
      retries: 30
  proxy:
    image: caddy:2
    volumes:
      - ./tests/Caddyfile:/etc/caddy/Caddyfile:ro
    ports: ["127.0.0.1:${THELXINOE_TEST_HTTPS_PORT:-9443}:9443"]
    networks: [proxy]
    depends_on:
      server:
        condition: service_healthy
networks:
  proxy:
    ipam:
      config:
        - subnet: ${THELXINOE_TEST_SUBNET:-172.31.250.0/24}
volumes:
  controller-state:
  state:
  cache:
  runtime:
  fixtures:
