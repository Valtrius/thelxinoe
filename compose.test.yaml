name: thelxinoe-test
services:
  controller:
    image: thelxinoe-controller:0.1.0
    network_mode: none
    volumes:
      - runtime:/run/thelxinoe
    read_only: true
    cap_drop: [ALL]
  server:
    image: thelxinoe-server:0.1.0
    ports:
      - "127.0.0.1:${THELXINOE_TEST_HTTP_PORT:-18484}:8484"
      - "127.0.0.1:${THELXINOE_TEST_HTTP_PORT:-18484}:7359/udp"
    environment:
      THELXINOE_PUBLIC_URL: https://localhost:${THELXINOE_TEST_HTTPS_PORT:-9443}
      THELXINOE_TRUSTED_PROXIES: ${THELXINOE_TEST_SUBNET:-172.31.250.0/24}
      RUST_LOG: ${THELXINOE_TEST_LOG:-thelxinoe=info}
      THELXINOE_DISCOVERY_URL: http://127.0.0.1:${THELXINOE_TEST_HTTP_PORT:-18484}
    depends_on:
      controller:
        condition: service_healthy
    volumes:
      - state:/var/lib/thelxinoe
      - cache:/var/cache/thelxinoe
      - ./.local/fixtures:/data:ro
      - runtime:/run/thelxinoe:ro
    networks: [proxy]
  proxy:
    image: caddy:2
    volumes:
      - ./tests/Caddyfile:/etc/caddy/Caddyfile:ro
    ports: ["127.0.0.1:${THELXINOE_TEST_HTTPS_PORT:-9443}:9443"]
    networks: [proxy]
    depends_on:
      server:
        condition: service_healthy
networks:
  proxy:
    ipam:
      config:
        - subnet: ${THELXINOE_TEST_SUBNET:-172.31.250.0/24}
volumes:
  state:
  cache:
  runtime:
