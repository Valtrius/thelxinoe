name: thelxinoe-test
services:
  controller:
    image: thelxinoe-controller:0.1.0
    network_mode: none
    volumes:
      - runtime:/run/thelxinoe
    read_only: true
    cap_drop: [ALL]
  server:
    image: thelxinoe-server:0.1.0
    ports: ["127.0.0.1:18484:8484"]
    environment:
      THELXINOE_PUBLIC_URL: https://localhost:9443
      THELXINOE_TRUSTED_PROXIES: 172.31.250.0/24
    depends_on:
      controller:
        condition: service_healthy
    volumes:
      - state:/var/lib/thelxinoe
      - cache:/var/cache/thelxinoe
      - ./.local/fixtures:/data:ro
      - runtime:/run/thelxinoe:ro
    networks: [proxy]
  proxy:
    image: caddy:2
    volumes:
      - ./tests/Caddyfile:/etc/caddy/Caddyfile:ro
    ports: ["127.0.0.1:9443:9443"]
    networks: [proxy]
    depends_on:
      server:
        condition: service_healthy
networks:
  proxy:
    ipam:
      config:
        - subnet: 172.31.250.0/24
volumes:
  state:
  cache:
  runtime:
